<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0f172a;
  color: white;
}

header {
  padding: 15px;
  text-align: center;
  background: #1e293b;
  font-size: 20px;
}

.container {
  padding: 15px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}

button {
  background: #22c55e;
  color: white;
  font-weight: bold;
}

.item {
  border-bottom: 1px solid #334155;
  padding: 10px;
}

.ingreso { color: #22c55e; }
.egreso { color: #ef4444; }

canvas {
  background: white;
  border-radius: 10px;
}
</style>

</head>
<body>

<header>📊 Finanzas PRO</header>

<div class="container">

<div class="card">
<h3 id="balance">Balance: S/ 0</h3>

<select id="tipo">
  <option value="ingreso">Ingreso</option>
  <option value="egreso">Egreso</option>
</select>

<select id="categoria">
  <option>Comida</option>
  <option>Transporte</option>
  <option>Trabajo</option>
  <option>Ocio</option>
  <option>Otros</option>
</select>

<input type="number" id="monto" placeholder="Monto">
<input type="text" id="desc" placeholder="Descripción">

<button onclick="guardar()">Guardar</button>
</div>

<div class="card">
<canvas id="grafico"></canvas>
</div>

<div class="card" id="lista"></div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("finanzasPro")) || [];

function guardar() {
  let tipo = document.getElementById("tipo").value;
  let categoria = document.getElementById("categoria").value;
  let monto = parseFloat(document.getElementById("monto").value);
  let desc = document.getElementById("desc").value;

  if (!monto || !desc) return alert("Completa los datos");

  let mov = {
    tipo,
    categoria,
    monto,
    desc,
    fecha: new Date().toLocaleDateString()
  };

  data.push(mov);
  localStorage.setItem("finanzasPro", JSON.stringify(data));

  mostrar();
}

function mostrar() {
  let lista = document.getElementById("lista");
  let balance = 0;
  let categorias = {};

  lista.innerHTML = "";

  data.slice().reverse().forEach(m => {
    let div = document.createElement("div");
    div.className = "item " + m.tipo;

    div.innerHTML = `
      ${m.fecha} - ${m.categoria}<br>
      S/ ${m.monto} - ${m.desc}
    `;

    lista.appendChild(div);

    if (m.tipo === "ingreso") balance += m.monto;
    else {
      balance -= m.monto;
      categorias[m.categoria] = (categorias[m.categoria] || 0) + m.monto;
    }
  });

  document.getElementById("balance").innerText = "Balance: S/ " + balance;

  dibujarGrafico(categorias);
}

let chart;

function dibujarGrafico(categorias) {
  let ctx = document.getElementById("grafico");

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: Object.keys(categorias),
      datasets: [{
        data: Object.values(categorias)
      }]
    }
  });
}

mostrar();
</script>

</body>
</html>
