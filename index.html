<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de Finanzas</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, select, button { margin: 5px; padding: 8px; }
    .ingreso { color: green; }
    .egreso { color: red; }
  </style>
</head>
<body>

<h2>Registro Diario</h2>

<select id="tipo">
  <option value="ingreso">Ingreso</option>
  <option value="egreso">Egreso</option>
</select>

<input type="number" id="monto" placeholder="Monto">
<input type="text" id="desc" placeholder="Descripción">
<button onclick="guardar()">Guardar</button>

<h3>Movimientos</h3>
<ul id="lista"></ul>

<script>
let data = JSON.parse(localStorage.getItem("finanzas")) || [];

function guardar() {
  let tipo = document.getElementById("tipo").value;
  let monto = document.getElementById("monto").value;
  let desc = document.getElementById("desc").value;

  let movimiento = {
    tipo,
    monto,
    desc,
    fecha: new Date().toLocaleDateString()
  };

  data.push(movimiento);
  localStorage.setItem("finanzas", JSON.stringify(data));
  mostrar();
}

function mostrar() {
  let lista = document.getElementById("lista");
  lista.innerHTML = "";

  data.forEach(m => {
    let li = document.createElement("li");
    li.className = m.tipo;
    li.textContent = `${m.fecha} - ${m.tipo} - S/ ${m.monto} - ${m.desc}`;
    lista.appendChild(li);
  });
}

mostrar();
</script>

</body>
</html>
