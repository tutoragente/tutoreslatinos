<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notas Importantes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Panel de filtros">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">N</div>
          <div>
            <h1>Notas importantes</h1>
            <p id="note-count">0 notas guardadas</p>
          </div>
        </div>

        <button class="primary-action" id="new-note-btn" type="button">
          <span aria-hidden="true">+</span>
          Nueva nota
        </button>

        <label class="field-label" for="search-input">Buscar</label>
        <div class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" placeholder="Título, descripción o etiqueta" />
        </div>

        <label class="field-label" for="topic-filter">Tema</label>
        <select id="topic-filter">
          <option value="all">Todos los temas</option>
        </select>

        <label class="field-label" for="tag-filter">Etiqueta</label>
        <select id="tag-filter">
          <option value="all">Todas las etiquetas</option>
        </select>

        <div class="quick-filters" aria-label="Filtros rápidos">
          <button class="filter-chip active" data-filter="all" type="button">Todas</button>
          <button class="filter-chip" data-filter="favorite" type="button">Favoritas</button>
          <button class="filter-chip" data-filter="archived" type="button">Archivadas</button>
        </div>

        <section class="stats" aria-label="Resumen">
          <div>
            <span id="stat-active">0</span>
            <small>activas</small>
          </div>
          <div>
            <span id="stat-favorite">0</span>
            <small>favoritas</small>
          </div>
          <div>
            <span id="stat-tags">0</span>
            <small>etiquetas</small>
          </div>
        </section>
      </aside>

      <main class="main-panel">
        <section class="list-panel" aria-label="Lista de notas">
          <div class="section-heading">
            <div>
              <span>Biblioteca</span>
              <strong id="current-filter-label">Todas las notas</strong>
            </div>
            <select id="sort-select" aria-label="Ordenar notas">
              <option value="updated-desc">Más recientes</option>
              <option value="created-desc">Fecha de creación</option>
              <option value="title-asc">Título A-Z</option>
              <option value="priority-desc">Prioridad</option>
            </select>
          </div>

          <div id="notes-list" class="notes-list"></div>
          <div id="empty-state" class="empty-state" hidden>
            <strong>No hay notas para mostrar</strong>
            <p>Crea una nota nueva o ajusta tus filtros de búsqueda.</p>
          </div>
        </section>

        <section class="editor-panel" aria-label="Editor de nota">
          <form id="note-form">
            <div class="editor-topbar">
              <div>
                <span id="form-mode">Nueva nota</span>
                <strong id="save-status">Lista para guardar</strong>
              </div>
              <div class="topbar-actions">
                <button id="favorite-btn" class="icon-btn" type="button" title="Marcar como favorita" aria-label="Marcar como favorita">☆</button>
                <button id="archive-btn" class="icon-btn" type="button" title="Archivar" aria-label="Archivar">□</button>
                <button id="delete-btn" class="danger-btn" type="button">Eliminar</button>
              </div>
            </div>

            <div class="form-grid">
              <label>
                <span>Tema</span>
                <select id="topic-input" required>
                  <option value="Trabajo">Trabajo</option>
                  <option value="Estudio">Estudio</option>
                  <option value="Personal">Personal</option>
                  <option value="Finanzas">Finanzas</option>
                  <option value="Salud">Salud</option>
                  <option value="Ideas">Ideas</option>
                  <option value="Otro">Otro</option>
                </select>
              </label>

              <label>
                <span>Prioridad</span>
                <select id="priority-input">
                  <option value="1">Baja</option>
                  <option value="2">Media</option>
                  <option value="3">Alta</option>
                </select>
              </label>

              <label>
                <span>Recordatorio</span>
                <input id="reminder-input" type="datetime-local" />
              </label>
            </div>

            <label class="title-field">
              <span>Título</span>
              <input id="title-input" type="text" maxlength="120" placeholder="Ej. Puntos clave de la reunión" required />
            </label>

            <label class="title-field">
              <span>Etiquetas</span>
              <input id="tags-input" type="text" placeholder="urgente, clientes, ideas" />
            </label>

            <div class="editor-block">
              <div class="toolbar" aria-label="Herramientas de texto enriquecido">
                <button type="button" data-command="bold" title="Negrita"><strong>B</strong></button>
                <button type="button" data-command="italic" title="Cursiva"><em>I</em></button>
                <button type="button" data-command="underline" title="Subrayado"><u>U</u></button>
                <button type="button" data-command="insertUnorderedList" title="Lista">•</button>
                <button type="button" data-command="insertOrderedList" title="Lista numerada">1.</button>
                <button type="button" data-command="formatBlock" data-value="blockquote" title="Cita">❝</button>
                <button type="button" data-command="createLink" title="Enlace">🔗</button>
                <button type="button" id="image-btn" title="Agregar imagen">▧</button>
                <button type="button" data-command="removeFormat" title="Limpiar formato">Tx</button>
                <input id="image-input" type="file" accept="image/*" hidden />
              </div>

              <div id="description-editor" class="rich-editor" contenteditable="true" aria-label="Descripción con texto enriquecido"></div>
            </div>

            <div class="form-actions">
              <button id="clear-btn" class="secondary-action" type="button">Limpiar</button>
              <button class="primary-action save-action" type="submit">Guardar nota</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <template id="note-template">
      <article class="note-card">
        <div class="note-card-head">
          <span class="topic-pill"></span>
          <span class="priority-dot"></span>
        </div>
        <h2></h2>
        <p></p>
        <div class="tag-row"></div>
        <footer>
          <span class="date-label"></span>
          <span class="status-label"></span>
        </footer>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
